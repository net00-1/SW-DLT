run_mode: "normal"                   # (Required) Allowed values: "normal", "install", "debug"
url: "https://example.com/album/xyz" # (Required) Main URL for remote media
type: "gallery"                      # (Required) Allowed values: "gallery", "video", "audio"

video_args:                          # (Required if type is 'video')
  res: "1080"                        # (Required) Allowed values: "360", "480", "720", "1080" "1440", "2160"
  fps: "60"                          # (Required) Allowed values: "30", "60"
  subtitles: true                    # (optional) Allowed values: true/false
  sub_lang: "en-US"                  # (Optional) Language code is platform dependant

gallery_args:                        # (Required if type is 'gallery')
  range: "1,3,5,6-9,11"              # (Required) Range expression for gallery downloads