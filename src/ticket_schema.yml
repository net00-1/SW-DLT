run_mode: "normal"                   # (Required) Allowed values: "normal", "install"
url: "https://example.com/album/xyz" # (Required if run_mode is "normal") Main URL for remote media
type: "gallery"                      # (Required if run_mode is "normal") Allowed values: "gallery", "video", "audio"
release_name: "SW-DLT"               # (Required) Name of the callback shortcut, cannot be empty
logging: false                       # (Required) This toggles logging function, cannot be empty

video_args:                          # (Required if type is 'video')
  res: "1080"                        # (Required) Allowed values: "360", "480", "720", "1080" "1440", "2160"
  fps: "60"                          # (Required) Allowed values: "30", "60"
  subtitles: true                    # (Required) Allowed values: true/false
  sub_lang: "en-US"                  # (Required) Language code is platform dependant

gallery_args:                        # (Required if type is 'gallery')
  range: "1,3,5,6-9,11"              # (Required) Range expression for gallery downloads